name: App Store

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TEAM_ID: 8MCK24K5U5
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -nE 's/^ *MARKETING_VERSION: "(.*)"$/\1/p' project.yml)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match MARKETING_VERSION $version"
            exit 1
          fi
      - name: Toolchain
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Install signing assets
        env:
          APP_CERT_P12: ${{ secrets.MAS_APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PRIVATE_KEYS="$RUNNER_TEMP/private_keys"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          for name in APP_CERT_P12 INSTALLER_CERT_P12; do
            printf '%s' "${!name}" | base64 --decode > "$RUNNER_TEMP/$name.p12"
            security import "$RUNNER_TEMP/$name.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/$name.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"
          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.provisionprofile" | plutil -extract UUID raw -)"
          mv "$RUNNER_TEMP/profile.provisionprofile" "$profiles/$uuid.provisionprofile"
          mkdir -p "$PRIVATE_KEYS"
          printf '%s\n' "$ASC_KEY_P8" > "$PRIVATE_KEYS/AuthKey.p8"
      - name: Build App Store package
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: make app-store TEAM_ID="$TEAM_ID" BUILD_NUMBER="$BUILD_NUMBER"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcrun altool --upload-package ".build/app-store/MIDI Router.pkg"
          --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID"
          --p8-file-path "$RUNNER_TEMP/private_keys/AuthKey.p8"
      - name: Remove signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys"
